services:
  mysql:
    image: mysql:8.4
    container_name: ecomm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecomm
      MYSQL_USER: ecomm_user
      MYSQL_PASSWORD: ecomm_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
